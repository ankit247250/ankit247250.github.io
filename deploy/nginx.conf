# Bansal International School — nginx site config
# Install to /etc/nginx/sites-available/bansal-international-school
# then: ln -s ../sites-available/bansal-international-school /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;

    # ── change this to your domain ──────────────────────────────
    server_name yourdomain.com www.yourdomain.com;
    # ────────────────────────────────────────────────────────────

    root /var/www/bansal-international-school;
    index index.html;

    charset utf-8;

    # security headers
    add_header X-Content-Type-Options   "nosniff"        always;
    add_header X-Frame-Options          "SAMEORIGIN"     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;

    # gzip
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json image/svg+xml font/woff2;

    # fonts — long cache, they're versioned by filename
    location /assets/fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # images — long cache
    location /assets/img/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # css / js — revalidate (no hashed filenames)
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
    }

    # pretty URLs: /anything/ -> /anything/index.html, fall back to index.html
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # never serve dotfiles
    location ~ /\. {
        deny all;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    access_log /var/log/nginx/bansal.access.log;
    error_log  /var/log/nginx/bansal.error.log;
}
